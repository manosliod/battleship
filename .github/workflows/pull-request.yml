name: Pull request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: manosliod/dev-tooling/.github/workflows/pr-title.yml@v1.3
    with:
      jira-project: KAN
