name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    uses: manosliod/dev-tooling/.github/workflows/release-please.yml@v1.3
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
